name: Compile check

on:
  push:
    branches-ignore: [ main, stats ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configure optional Fuel Trip Planner debug signing
        if: github.ref_name == 'feature/fuel-trip-planner'
        env:
          FUEL_DEBUG_KEYSTORE_B64: ${{ secrets.FUEL_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$FUEL_DEBUG_KEYSTORE_B64" ]; then
            umask 077
            android_user_dir="${ANDROID_USER_HOME:-$HOME/.android}"
            mkdir -p "$android_user_dir"
            printf '%s' "$FUEL_DEBUG_KEYSTORE_B64" | base64 --decode > "$android_user_dir/debug.keystore"
          else
            echo 'Using the runner-generated debug certificate.'
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace --no-daemon
      - name: Upload Fuel Trip Planner debug APK
        if: github.ref_name == 'feature/fuel-trip-planner'
        uses: actions/upload-artifact@v4
        with:
          name: LionFlow-fuel-trip-planner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run Fuel Trip Planner unit tests and lint
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/fuel-trip-planner'
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon --continue
      - name: Allow the runner to use KVM
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/fuel-trip-planner'
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Run Android instrumentation tests
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/fuel-trip-planner'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon || { adb logcat -d -s FuelMap FuelMapTest Mbgl MapLibre AndroidRuntime; find app/build/outputs/androidTest-results/connected/debug -name "TEST-*.xml" -exec cat {} +; exit 1; }
