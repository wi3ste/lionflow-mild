name: Compile check

on:
  push:
    branches-ignore: [ main, stats ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK (no signing secrets needed)
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace --no-daemon
      - name: Upload Fuel Trip Planner debug APK
        if: github.ref_name == 'feature/fuel-trip-planner'
        uses: actions/upload-artifact@v4
        with:
          name: LionFlow-fuel-trip-planner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
