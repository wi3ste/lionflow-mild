name: Compile check

on:
  push:
    branches-ignore: [ main, stats ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK (no signing secrets needed)
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace --no-daemon
      - name: Upload Fuel Trip Planner debug APK
        if: github.ref_name == 'feature/fuel-trip-planner'
        uses: actions/upload-artifact@v4
        with:
          name: LionFlow-fuel-trip-planner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Allow the runner to use KVM
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/fuel-trip-planner'
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Verify fuel markers and clusters on Android
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/fuel-trip-planner'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=no.lionflow.app.ui.screens.FuelMapRenderingTest --no-daemon
